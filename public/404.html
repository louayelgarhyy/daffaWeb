<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>

  <!--
    REACT ROUTER FIX FOR GITHUB PAGES

    How this works:
    1. User visits /daffaWeb/shop directly (or refreshes the page)
    2. GitHub Pages can't find "shop.html", so it serves THIS 404.html file
    3. This script captures the path (/shop) from the URL
    4. Redirects to index.html with the path stored in a query parameter (?p=/shop)
    5. main.tsx reads the query parameter and restores the route
    6. User sees the correct page!

    Why we need this:
    - GitHub Pages is a static file server - it doesn't know about React Router
    - Single Page Apps (SPAs) handle routing in JavaScript, not server files
    - Without this, direct links and page refreshes would show 404 errors
  -->

  <script>
    // Get the current path segments from the URL
    var pathSegmentsToKeep = 1; // Keep "/daffaWeb" part

    // Extract the path after the repo name
    // Example: /daffaWeb/shop/products → /shop/products
    var l = window.location;
    var path = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
    var route = l.pathname.slice(path.length);

    // Redirect to index.html with the route stored in query parameter
    // Example: redirect to /daffaWeb/?p=/shop&q=search
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      path + '/?p=' + route +
      (l.search ? '&q=' + l.search.slice(1) : '') +
      l.hash
    );
  </script>
</head>
<body>
  <!-- Fallback message if JavaScript is disabled -->
  <noscript>
    <h1>Redirecting...</h1>
    <p>Please enable JavaScript to continue.</p>
  </noscript>
</body>
</html>
